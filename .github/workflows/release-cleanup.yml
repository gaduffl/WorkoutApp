name: Release cleanup

# Manual maintenance tool. The main CI publishes one debug prerelease per
# commit, so the Releases list accumulates; this prunes a stray/old one by tag
# (and its git tag). Run from the Actions tab → "Release cleanup" → Run
# workflow, or via the API with a `tag` input.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to delete (e.g. debug-aa91c96)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --cleanup-tag --yes
            echo "Deleted release ${TAG}."
          else
            echo "No release tagged ${TAG}; nothing to do."
          fi
