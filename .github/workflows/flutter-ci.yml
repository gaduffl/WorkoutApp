name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - run: flutter pub get
      - name: Format recovery changes for review
        run: |
          dart format lib/ai/ai_explainer.dart lib/data/serializers.dart lib/engine/decision_engine.dart lib/engine/fallback_templates.dart lib/engine/stimulus_ledger_engine.dart lib/models/ladders.dart lib/models/lower_back_recovery.dart lib/models/rule_key.dart lib/models/user_settings.dart lib/state/app_controller.dart lib/ui/screens/checkin_screen.dart lib/ui/screens/history_screen.dart lib/ui/screens/home_screen.dart lib/ui/screens/logger_screen.dart lib/ui/screens/settings_screen.dart test/engine/decision_engine_test.dart test/state/app_controller_settings_test.dart lib/engine/recovery_program_engine.dart lib/models/recovery_program.dart lib/ui/widgets/recovery_widgets.dart test/engine/recovery_program_test.dart test/ui/recovery_widgets_test.dart test/state/app_controller_cardio_test.dart
          dart fix --apply --code=curly_braces_in_flow_control_structures . > /tmp/recovery-format-fixes.txt
          dart format lib/ai/ai_explainer.dart lib/data/serializers.dart lib/engine/decision_engine.dart lib/engine/fallback_templates.dart lib/engine/stimulus_ledger_engine.dart lib/models/ladders.dart lib/models/lower_back_recovery.dart lib/models/rule_key.dart lib/models/user_settings.dart lib/state/app_controller.dart lib/ui/screens/checkin_screen.dart lib/ui/screens/history_screen.dart lib/ui/screens/home_screen.dart lib/ui/screens/logger_screen.dart lib/ui/screens/settings_screen.dart test/engine/decision_engine_test.dart test/state/app_controller_settings_test.dart lib/engine/recovery_program_engine.dart lib/models/recovery_program.dart lib/ui/widgets/recovery_widgets.dart test/engine/recovery_program_test.dart test/ui/recovery_widgets_test.dart test/state/app_controller_cardio_test.dart
          echo FORMAT_PATCH_BEGIN
          git diff --binary -- '*.dart' | gzip -c | base64 -w 0
          echo
          echo FORMAT_PATCH_END
      - run: flutter analyze
      - run: flutter test

  validate-apk:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --debug --build-number=${{ github.run_number }}

  publish-apk:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: analyze-and-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - run: flutter pub get
      # Monotonic versionCode per CI run: Android treats equal codes as a
      # reinstall and lower ones as a downgrade; a strictly increasing code
      # makes every APK installable as an update over the previous one
      # (signature continuity comes from the pinned android/app/debug.keystore).
      - run: flutter build apk --debug --build-number=${{ github.run_number }}
      - name: Name the APK with the app version
        id: apk
        run: |
          # versionName from pubspec (part before "+"); build number is the CI
          # run number (the versionCode baked in above).
          version="$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          name="MorningCoach-v${version}-build${{ github.run_number }}-debug.apk"
          cp build/app/outputs/flutter-apk/app-debug.apk "${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.name }}
          APP_VERSION: ${{ steps.apk.outputs.version }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="debug-${short_sha}"
          # Create the release without the asset first. Creating it with the
          # APK in one call races the uploads.github.com endpoint, which can
          # 404 for a few seconds until the new release propagates. Idempotent
          # across re-runs.
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --target "${GITHUB_SHA}" \
              --title "MorningCoach v${APP_VERSION} (build ${{ github.run_number }}) · ${short_sha}" \
              --notes "Automated debug APK · v${APP_VERSION} build ${{ github.run_number }} · commit ${GITHUB_SHA}." \
              --prerelease
          fi
          # Upload the asset separately, retrying through the propagation lag.
          for attempt in 1 2 3 4 5; do
            if gh release upload "${tag}" "${APK}" --clobber; then
              echo "Uploaded APK on attempt ${attempt}."
              exit 0
            fi
            echo "Upload attempt ${attempt} failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "APK upload failed after ${attempt} attempts." >&2
          exit 1
