name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    if: >
      github.event_name != 'pull_request' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  validate-apk:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --debug --build-number=${{ github.run_number }}

  publish-apk:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
      - run: flutter pub get
      # Monotonic versionCode per CI run: Android treats equal codes as a
      # reinstall and lower ones as a downgrade; a strictly increasing code
      # makes every APK installable as an update over the previous one
      # (signature continuity comes from the pinned android/app/debug.keystore).
      - run: flutter build apk --debug --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-debug.apk MorningCoach-debug.apk
      - name: Publish APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="debug-${short_sha}"
          # Create the release without the asset first. Creating it with the
          # APK in one call races the uploads.github.com endpoint, which can
          # 404 for a few seconds until the new release propagates. Idempotent
          # across re-runs.
          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --target "${GITHUB_SHA}" \
              --title "MorningCoach debug ${short_sha}" \
              --notes "Automated debug APK from commit ${GITHUB_SHA}." \
              --prerelease
          fi
          # Upload the asset separately, retrying through the propagation lag.
          for attempt in 1 2 3 4 5; do
            if gh release upload "${tag}" MorningCoach-debug.apk --clobber; then
              echo "Uploaded APK on attempt ${attempt}."
              exit 0
            fi
            echo "Upload attempt ${attempt} failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "APK upload failed after ${attempt} attempts." >&2
          exit 1
